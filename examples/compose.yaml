# docker compose up -d   or   podman compose up -d
# Expects config.yaml and secrets/ next to this file.
services:
  outlook-to-imap:
    image: ghcr.io/martinfrancois/outlook-to-imap:1 # x-release-please-major
    restart: unless-stopped
    # The service finishes the message it is on when stopped; give it the time to.
    stop_grace_period: 30s
    # The service writes only to /data and /tmp. The SQLite driver loads its native library from
    # /tmp, so /tmp needs exec.
    read_only: true
    tmpfs:
      - /tmp:exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./secrets:/config/secrets:ro
      - outlook-to-imap-data:/data
    # Uncomment to reach /health from the host. That, and any other container that checks /health,
    # needs monitoring.healthBindAddress: 0.0.0.0 in config.yaml. /health has no authentication,
    # so keep the published port on 127.0.0.1.
    # ports:
    #   - "127.0.0.1:8080:8080"

volumes:
  outlook-to-imap-data:
