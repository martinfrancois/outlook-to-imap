name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Kept for maintainers who start CI on a branch by hand; nothing in the repository dispatches CI, see docs/adr/0025-the-release-workflow-approves-its-own-pull-request-runs.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Without this job a new Java LTS goes untested until someone edits the matrix, see docs/adr/0011-java-21-minimum-and-every-lts-tested.md
  # The committed list must start at maven.compiler.release; endoflife.date's reply can add versions but never drop one.
  lts:
    name: lts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: List current Java LTS versions
        id: pick
        run: |
          committed='["21","25"]'
          site=$(curl -fsS --max-time 20 https://endoflife.date/api/eclipse-temurin.json \
            | jq -c --argjson committed "$committed" '($committed | map(tonumber) | min) as $floor
                | [.[] | select(.lts != false) | .cycle | tostring | select(test("^[0-9]+$"))
                  | tonumber | select(. >= $floor) | tostring]') \
            || site=''
          if [ -z "$site" ] || [ "$site" = '[]' ]; then
            echo "::warning::endoflife.date gave no usable answer, testing the committed list $committed only"
            site='[]'
          fi
          # Every entry goes through tonumber, so "021" and "21" become one "21" and a committed
          # version always survives.
          versions=$(jq -cn --argjson site "$site" --argjson committed "$committed" \
            '$site + $committed | map(tonumber) | unique | map(tostring)')
          echo "Testing Java $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: test (Java ${{ matrix.java }})
    needs: lts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every leg reports on its own; cancelling the rest after one failure would hide which
      # Java versions still work.
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.lts.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Runs the tests against SQLite and, through Testcontainers and the runner's Docker,
      # PostgreSQL, then enforces the coverage gate.
      - name: Verify
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-java-${{ matrix.java }}
          if-no-files-found: ignore
          path: target/site/jacoco

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and run it
        run: scripts/smoke-image.sh docker outlook-to-imap:ci

  # Without this job the status check "build" that the ruleset on main requires never reports, see docs/adr/0012-releases-with-release-please-after-a-live-check.md
  # The matrix legs are named "test (Java 21)" and so on and change with every new LTS; this job carries their result, and the image check's.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lts, test, image]
    # Without always() this job is skipped when a leg fails, and a skipped required check does
    # not block a merge.
    if: always()
    steps:
      - name: Require every job to have passed
        env:
          LTS: ${{ needs.lts.result }}
          TEST: ${{ needs.test.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "lts: ${LTS}, test: ${TEST}, image: ${IMAGE}"
          if [ "${LTS}" != "success" ] || [ "${TEST}" != "success" ] || [ "${IMAGE}" != "success" ]; then
            echo "::error::A required job did not pass."
            exit 1
          fi
