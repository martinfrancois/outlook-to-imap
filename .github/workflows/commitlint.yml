name: Commitlint

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Prepare commitlint
        # commitlint resolves `extends` from the config file's directory. Keep a
        # runner-local config copy next to the installed packages instead of
        # adding a package.json to this Maven repository.
        run: |
          set -euo pipefail
          COMMITLINT_HOME="$RUNNER_TEMP/commitlint"
          mkdir -p "$COMMITLINT_HOME"
          printf '{"private":true}\n' > "$COMMITLINT_HOME/package.json"
          cp commitlint.config.cjs "$COMMITLINT_HOME/commitlint.config.cjs"
          cp commitlint.message.config.cjs "$COMMITLINT_HOME/commitlint.message.config.cjs"
          pnpm --dir "$COMMITLINT_HOME" add --silent \
            @commitlint/cli@21.0.1 \
            @commitlint/config-conventional@21.0.1
          {
            echo "COMMITLINT_BIN=$COMMITLINT_HOME/node_modules/.bin/commitlint"
            echo "COMMITLINT_TITLE_CONFIG=$COMMITLINT_HOME/commitlint.config.cjs"
            echo "COMMITLINT_MESSAGE_CONFIG=$COMMITLINT_HOME/commitlint.message.config.cjs"
          } >> "$GITHUB_ENV"
      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | "$COMMITLINT_BIN" --config "$COMMITLINT_TITLE_CONFIG"
      - name: Lint pull request commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$COMMITLINT_BIN" --config "$COMMITLINT_MESSAGE_CONFIG" \
            --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose
