name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Without this group two quick pushes to main run release-please side by side and approve runs against the same head, see docs/adr/0025-the-release-workflow-approves-its-own-pull-request-runs.md
# A queued run that a newer one replaces loses nothing: release-please releases every merged release pull request still labeled "autorelease: pending".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      # Sign the attestations with the workflow's OIDC identity and store them on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          path: release-source
          persist-credentials: false

      - name: Set up Java
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"
          cache: maven

      # The full build again, on the tagged commit, so the jar that ships is one that passed.
      - name: Build and test the jar
        if: ${{ steps.release.outputs.release_created == 'true' }}
        working-directory: release-source
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./mvnw -B verify
          mkdir dist
          cp target/outlook-to-imap.jar "dist/outlook-to-imap-${VERSION}.jar"
          # Without this file the README's checksum check has nothing to compare the jar against, see docs/adr/0021-release-integrity-with-sha3-and-attestations.md
          # SHA3-256, because it is the project's hash wherever it picks one.
          (cd dist && openssl dgst -sha3-256 -r "outlook-to-imap-${VERSION}.jar" > "outlook-to-imap-${VERSION}.jar.sha3-256")
          test "$(unzip -p "dist/outlook-to-imap-${VERSION}.jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')" = "$VERSION"

      # A checksum shows the download is intact; the attestation also shows this workflow built it.
      - name: Attest the jar
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-source/dist/outlook-to-imap-${{ steps.release.outputs.version }}.jar

      - name: Upload the jar to the draft release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" release-source/dist/* --clobber

      - name: Set up QEMU
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image tags
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      # amd64 for servers, arm64 for a Raspberry Pi or an ARM VPS. The jar is the same on both;
      # sqlite-jdbc carries the native library for each.
      - name: Build and push the image
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest the image
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for repositories owned by an organization.
          create-storage-record: false

      - name: Publish the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest

  # Without this job each release pull request update waits for a manual approval, see docs/adr/0025-the-release-workflow-approves-its-own-pull-request-runs.md
  # A job of its own after the release job, so its failure never stops a release.
  approve-release-pr-runs:
    name: Approve the release pull request's runs
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Approve the held runs on the release branch head
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ needs.release-please.outputs.pr }}
          # GitHub creates the held runs a few seconds after the push. The number of pull_request
          # workflows isn't known here, so the step keeps approving for the whole window.
          WAIT_SECONDS: 90
          POLL_SECONDS: 5
        run: |
          set -euo pipefail
          branch=$(jq -r '.headBranchName' <<< "$PULL_REQUEST")
          # The branch ref, because the pull request's head lags a moment behind the push.
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')
          # A run approved a moment ago can still be listed as held, and a second approval may fail.
          declare -A approved=()
          deadline=$((SECONDS + WAIT_SECONDS))
          while (( SECONDS < deadline )); do
            # The URL pins the commit. jq keeps runs of this repository that the Actions token's
            # push caused, so a fork's run or a person's push still waits for a maintainer.
            ids=$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&status=action_required&head_sha=$sha&per_page=100" |
              jq -r --arg repo "$GH_REPO" '.workflow_runs[]
                | select(.head_repository.full_name == $repo and .actor.login == "github-actions[bot]")
                | .id')
            for id in $ids; do
              [[ -v approved[$id] ]] && continue
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" --silent
              approved[$id]=1
              echo "Approved run $id on $sha"
            done
            sleep "$POLL_SECONDS"
          done
          if (( ${#approved[@]} > 0 )); then
            exit 0
          fi
          # release-please reports a pull request only when it pushed the branch, so a head with no
          # pull_request run at all means the pull request has no checks.
          runs=$(gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$sha&per_page=100" |
            jq --arg repo "$GH_REPO" '[.workflow_runs[] | select(.head_repository.full_name == $repo)] | length')
          if (( runs == 0 )); then
            echo "::error::No pull_request run for $sha appeared within $WAIT_SECONDS seconds"
            exit 1
          fi
          # Someone approved them first, a person pushed after release-please, or GitHub stopped
          # holding these runs. CI runs either way; the last case makes this job unnecessary.
          echo "::warning::No held run to approve on $sha, but $runs pull_request runs exist"
