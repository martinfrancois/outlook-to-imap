name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare or publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      packages: write
      # Sign the attestations with the workflow's OIDC identity and store them on GitHub.
      id-token: write
      attestations: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run CI on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        # The pull request arrives as JSON text and is parsed in the script: an expression such as
        # fromJSON fails the step whenever the output is empty.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r '.headBranchName' <<< "$PULL_REQUEST")"

      - name: Check out the release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          path: release-source
          persist-credentials: false

      - name: Set up Java
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"
          cache: maven

      # The full build again, on the tagged commit, so the jar that ships is one that passed.
      - name: Build and test the jar
        if: ${{ steps.release.outputs.release_created == 'true' }}
        working-directory: release-source
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./mvnw -B verify
          mkdir dist
          cp target/outlook-to-imap.jar "dist/outlook-to-imap-${VERSION}.jar"
          # SHA3-256 is the project's hash where it picks one; docs/adr/0021-release-integrity-with-sha3-and-attestations.md
          (cd dist && openssl dgst -sha3-256 -r "outlook-to-imap-${VERSION}.jar" > "outlook-to-imap-${VERSION}.jar.sha3-256")
          test "$(unzip -p "dist/outlook-to-imap-${VERSION}.jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')" = "$VERSION"

      # A checksum shows the download is intact; the attestation also shows this workflow built it.
      - name: Attest the jar
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-source/dist/outlook-to-imap-${{ steps.release.outputs.version }}.jar

      - name: Upload the jar to the draft release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" release-source/dist/* --clobber

      - name: Set up QEMU
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image tags
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      # amd64 for servers, arm64 for a Raspberry Pi or an ARM VPS. The jar is the same on both;
      # sqlite-jdbc carries the native library for each.
      - name: Build and push the image
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest the image
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for repositories owned by an organization.
          create-storage-record: false

      - name: Publish the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest
